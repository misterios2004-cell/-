name: Сборка

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Тесты
        run: python -m unittest discover -s tests -t .
      - name: Сборка Attestation.exe
        run: |
          pip install pyinstaller==6.11.1
          pyinstaller --noconfirm Attestation.spec
      - uses: actions/upload-artifact@v5
        with:
          name: Attestation-windows
          path: dist/Attestation.exe
      - name: Публикация в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v1.${{ github.run_number }}" dist/Attestation.exe
          --target "${{ github.sha }}"
          --title "Attestation v1.${{ github.run_number }}"
          --notes "Программа для Windows: скачайте Attestation.exe и запустите. Установка не требуется."
