name: Веб-версия (GitHub Pages)

# Копирует папку www в ветку gh-pages. Включите один раз:
# Settings → Pages → Build and deployment → Source: Deploy from a branch → gh-pages / (root).
on:
  push:
    branches: [main, 'claude/**']
    paths: ['www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Веб-версия из ${{ github.sha }}"
